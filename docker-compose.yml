services:
  upstream:
    build: ./upstream
  proxy:
    build: ./proxy
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_URL: http://upstream:3000
      PROXY_PORT: 8080
    depends_on:
      - upstream

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proxy
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
