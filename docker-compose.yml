services:
  upstream:
    build: ./upstream

  proxy:
    build: ./proxy
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_URL: http://upstream:3000
      PROXY_PORT: 8080
      DATABASE_URL: postgres://proxy:localdev@db:5432/proxy
    depends_on:
      upstream:
        condition: service_started
      db:
        condition: service_healthy
  admin-api:
    build: ./admin-api
    ports:
      - "9090:9090"
    environment:
      ADMIN_PORT: 9090
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in the root .env file}
      DATABASE_URL: postgres://proxy:localdev@db:5432/proxy
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-2000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proxy
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy -d proxy"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  postgres_data: